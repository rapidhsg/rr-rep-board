name: Refresh rep board
on:
  schedule:
    # About 1h40m after each AccuLynx run lands in rr-metrics-data (runs at 6, 9 AM, 12, 3, 6 PM Eastern).
    # Eastern standard time: 6:45 AM, 9:45 AM, 12:45 PM, 3:45 PM, 6:45 PM. One hour later in daylight time.
    - cron: "45 11,14,17,20,23 * * *"
  workflow_dispatch:
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build data/reps.json from rr-metrics-data
        env:
          GH_TOKEN: ${{ secrets.RR_METRICS_READ_TOKEN }}   # read-only token for rapidhsg/rr-metrics-data
        run: python build_reps.py
      - name: Commit new numbers
        run: |
          git config user.name "rep-board-bot"
          git config user.email "rep-board-bot@users.noreply.github.com"
          git add data/reps.json
          git diff --cached --quiet || git commit -m "Refresh rep board numbers"
          git pull --rebase
          git push
